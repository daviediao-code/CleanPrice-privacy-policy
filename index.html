<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanPrice — Legal</title>
<meta name="description" content="Privacy policy and terms of service for CleanPrice.">
<style>
  :root {
    --page: #fbfbfa;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6a6a70;
    --border: rgba(0,0,0,0.10);
    --accent: #185fa5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #131315;
      --card: #1c1c1f;
      --text: #ececee;
      --muted: #9d9da4;
      --border: rgba(255,255,255,0.12);
      --accent: #85b7eb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 44px 40px;
  }
  .brand {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  h1 { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 30px; font-size: 15px; }
  a.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
  }
  a.item:last-of-type { border-bottom: 1px solid var(--border); }
  a.item:hover .name { color: var(--accent); }
  .name { font-weight: 500; }
  .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .arrow { color: var(--muted); flex: none; }
  .contact { margin: 26px 0 0; font-size: 14px; color: var(--muted); }
  .contact a { color: var(--accent); text-decoration: none; }
  @media (max-width: 560px) { body { padding: 20px 12px; } .card { padding: 30px 22px; } }
</style>
</head>
<body>
<main class="card">
  <p class="brand">CleanPrice</p>
  <h1>Legal documents</h1>
  <p class="sub">Quoting and cost tracking for cleaning businesses.</p>

  <a class="item" href="privacy-policy.html">
    <span>
      <span class="name">Privacy Policy</span>
      <div class="desc">What the app does with your data — and what it does not.</div>
    </span>
    <span class="arrow">→</span>
  </a>

  <a class="item" href="terms.html">
    <span>
      <span class="name">Terms of Service</span>
      <div class="desc">Licence, purchases, warranties and liability.</div>
    </span>
    <span class="arrow">→</span>
  </a>

  <p class="contact">Questions? <a href="mailto:daviediao@gmail.com">daviediao@gmail.com</a></p>
</main>
</body>
</html>
